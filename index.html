<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>図面積算AI デモ | AITech</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 話し手の横で動く道具。文字は値と単位だけ
   IDEA: 図面に付けた番号札と、同じ番号の値札
   PICTURE: その場で描いた図面の切り抜きに、読み取った数字そのものの枠
   COLOUR and TYPE: 白地、AITech Blue主・Teal補助、差はamber。IBM Plex Sans JP
   LAYOUT: 細いヘッダーと4つの工程タブ、下は1画面1つの絵 */
:root{color-scheme:light;--blue:#0050A2;--blue6:#004487;--b50:#EEF6FF;--b100:#D8EAFE;--b300:#72A9DD;--teal:#00A88F;--tealTx:#007D6D;
--ink:#22252B;--sub:#4E565F;--mute:#6C7680;--rule:#C7CFD7;--n50:#F7F9FB;--n100:#EEF2F5;--warn:#C28600;--warnTx:#7A5400;--wbg:#FDF1D6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 "IBM Plex Sans JP",system-ui,sans-serif;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:18px;padding:12px max(2.5vw,16px);border-bottom:1px solid var(--rule);min-height:62px}
header img{height:24px}
header span{font-size:14px;color:var(--sub)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:20px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sub);min-height:40px}
nav button b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--b300);color:var(--blue);font-size:12px}
nav button[aria-selected=true]{background:var(--b50);color:var(--blue6);font-weight:500}
nav button[aria-selected=true] b{background:var(--blue);border-color:var(--blue);color:#fff}
nav i{align-self:center;width:18px;height:1px;background:var(--rule)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
main{flex:1;padding:14px max(2.5vw,16px);display:flex;flex-direction:column;min-height:0}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:22px;padding:0 20px;min-height:44px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.sec{background:#fff;color:var(--blue6)}
.btn.ic{width:44px;padding:0;justify-content:center;font-size:18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* 0 開始・読み込み */
.start{flex:1;display:grid;place-items:center}
.drop{width:min(560px,100%);border:2px dashed var(--b300);border-radius:10px;padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--b50);transition:background .2s}
.drop.over{background:var(--b100)}
.load{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch}
.load .n{font-size:44px;font-weight:700;color:var(--blue);line-height:1}
.load .n small{font-size:18px;color:var(--sub);font-weight:400;margin-left:6px}
.prog{height:8px;background:var(--n100);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);width:0;transition:width .15s}
.err{color:var(--warnTx);background:var(--wbg);padding:10px 14px;border-radius:6px}
/* 1 図面 */
.pdf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start;overflow:auto}
.pg{border:1px solid var(--n100);border-radius:3px;padding:3px;opacity:.35;cursor:pointer}
.pg canvas{width:100%;display:block}
.pg.on{opacity:1;border:2px solid var(--blue);padding:2px}
.pg.on.q{border-color:var(--teal)}
.tally{display:flex;gap:28px;align-items:flex-end;margin:4px 0 18px;flex-wrap:wrap}
.tally div{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--sub)}
.tally strong{font-size:44px;line-height:1;color:var(--ink)}
.tally .a strong{color:var(--blue)}.tally .b strong{color:var(--tealTx)}
.tally i{display:inline-block;width:14px;height:14px;border-radius:2px;border:2px solid var(--blue);margin-right:2px}
.tally .b i{border-color:var(--teal)}
/* 2 読み取り */
.read{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;min-height:0;align-items:center}
.stage{position:relative;margin:auto;cursor:zoom-in}
.stage canvas{width:100%;height:100%;display:block}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.box{fill:rgba(0,80,162,.08);stroke:var(--blue);stroke-width:2.5}
.mk circle{fill:var(--blue)}.mk text{fill:#fff;font:700 13px "IBM Plex Sans JP";text-anchor:middle;dominant-baseline:central}
.who{font-size:14px;color:var(--sub);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.who button{border:1px solid var(--rule);background:#fff;border-radius:14px;font-size:12px;padding:2px 10px;cursor:pointer;min-height:28px}
.v{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--n100)}
.v>b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-size:14px}
.v span{font-size:13px;color:var(--sub);display:block}
.v strong{font-size:24px;line-height:1.25}
.calc{margin-top:16px;border-radius:6px;background:var(--b50);padding:16px 18px}
.calc .eq{font-size:22px;font-variant-numeric:tabular-nums}
.calc .eq em{font-style:normal;color:var(--blue);font-weight:700}
.calc .c{font-size:13px;color:var(--sub);margin:2px 0 10px}
.calc .r{font-size:34px;font-weight:700;color:var(--blue);line-height:1.1}
.calc .r small{font-size:16px;margin-left:4px}
.calc.ind{background:var(--n50)}.calc.ind .r{color:var(--sub);font-size:22px}
.flag{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:12px;font-size:13px;background:var(--wbg);color:var(--warnTx);border:1px solid #EAC77A}
.strip{display:flex;gap:4px;overflow-x:auto;padding:12px 0 4px}
.strip button{flex:none;border:1px solid var(--b100);background:var(--b50);border-radius:3px;font-size:11px;padding:4px 6px;cursor:pointer;color:var(--blue6);min-width:52px}
.strip button.ind{background:var(--n50);border-color:var(--n100);color:var(--mute)}
.strip button.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.strip .sep{flex:none;width:1px;background:var(--rule);margin:0 6px}

/* 2 上部の建具ボタン */
.top{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--n100);margin-bottom:10px}
.top .lg{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);min-width:120px}
.top .lg b{font-size:26px;color:var(--ink);line-height:1;margin-right:4px}
.top .lg .o b{color:#D97A00}
.eg{display:flex;flex-direction:column;gap:5px;flex:1 1 auto}
.eg>span{font-size:13px;color:var(--sub)}
.eg>div{display:flex;flex-wrap:wrap;gap:4px}
.it{border:1px solid var(--b100);background:var(--b50);color:var(--blue6);border-radius:4px;min-width:58px;height:40px;padding:0 6px;font-size:12px;font-weight:500;cursor:pointer}
.it.ng{background:#FFF1DE;border-color:#F0A54A;color:#8A4B00}
.it.cur{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.it.ng.cur{background:#D97A00;border-color:#D97A00;color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #D97A00}
.why{display:inline-block;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:500;background:#FFF1DE;color:#8A4B00;border:1px solid #F0A54A}
.why.ok{background:var(--b50);color:var(--blue6);border-color:var(--b100)}
.read2 .calc{margin-top:10px;padding:10px 14px}.read2 .calc .c{margin:0}.read2 .calc .eq{font-size:20px}
.read2{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;min-height:0}
.read2 .stage{margin:0 auto}
.v2{display:grid;grid-template-columns:28px 96px 1fr;align-items:center;gap:10px;padding:3px 0;border-bottom:1px solid var(--n100)}
.v2>b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px}
.v2 span{font-size:13px;color:var(--sub)}
.v2 strong{font-size:18px}
.cmp2{display:grid;grid-template-columns:96px 1fr 1fr;margin-top:8px;font-size:15px}
.cmp2 div{padding:4px 10px;border-bottom:1px solid var(--n100);text-align:right;font-variant-numeric:tabular-nums}
.cmp2 div:nth-child(3n+1){text-align:left;color:var(--sub);font-size:13px;padding-left:0}
.cmp2 .h{font-size:13px;color:var(--sub)}
.cmp2 .x{background:#FFF1DE;color:#8A4B00;font-weight:700}

/* 2 縦の一覧＋大きな図面＋取得結果パネル */
.rv{flex:1;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;min-height:0}
.list{border:1px solid var(--rule);border-radius:6px;overflow:auto;min-height:0}
.list .cnt{display:flex;gap:14px;padding:10px 12px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--sub);position:sticky;top:0;background:#fff;z-index:1}
.list .cnt b{font-size:22px;color:var(--ink);margin-right:3px}.list .cnt .o b{color:#D97A00}
.list h4{margin:0;padding:8px 12px 4px;font-size:12px;color:var(--sub);font-weight:500;background:var(--n50)}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--n100);background:#fff;text-align:left;padding:0 12px;min-height:44px;cursor:pointer;border-left:4px solid transparent}
.row b{font-size:14px;min-width:52px}.row span{font-size:13px;color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.ng{background:#FFF6EA;border-left-color:#F0A54A}.row.ng i{font-style:normal;font-size:11px;color:#8A4B00;white-space:nowrap}
.row.cur{background:var(--b50);border-left-color:var(--blue)}.row.ng.cur{background:#FFE7C7;border-left-color:#D97A00}
.view{position:relative;border:1px solid var(--rule);border-radius:6px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.vbar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--n100);font-size:14px;color:var(--sub)}
.vbar b{color:var(--ink);font-size:16px}
.vbar .sp{flex:1}
.canvasbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;background:#fff}
.vbody{flex:1;min-height:0;display:flex}
.vbody .canvasbox{flex:1;min-width:0}
.drawer{flex:none;width:0;overflow:hidden auto;background:#fff;border-left:0 solid var(--rule);transition:width .25s}
.drawer>div{width:420px;padding:14px 18px}
.drawer.open{width:420px;border-left-width:1px}
.btn.on{background:var(--blue6)}
/* 全体図 */
.modal{position:fixed;inset:0;background:rgba(21,24,29,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.sheet{background:#fff;border-radius:6px;max-width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet .h{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:14px}
.sheet .h button{margin-left:auto}
.sheet .b{position:relative;overflow:auto}
.sheet canvas{display:block}
.sheet svg{position:absolute;inset:0;pointer-events:none}
/* 3 Excel */
.xlbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #B8C2CC;border-bottom:0;border-radius:3px 3px 0 0;font-size:14px;flex-wrap:wrap}
.xlbar .tabs{display:flex;gap:4px;margin-left:auto}
.xlbar .tabs button{border:1px solid var(--rule);background:#fff;border-radius:3px;padding:2px 12px;cursor:pointer;font-size:13px;min-height:32px}
.xlbar .tabs button[aria-pressed=true]{background:var(--b50);border-color:var(--blue);color:var(--blue6)}
.xl{border:1px solid #B8C2CC;overflow:auto;flex:1;min-height:0}
.xl table{border-collapse:collapse;width:100%;font-size:13px}
.xl th{position:sticky;top:0;background:#EEF2F5;font-weight:500;border:1px solid #D0D7DE;padding:6px 8px;white-space:nowrap;z-index:1}
.xl td{border:1px solid #E1E6EB;padding:5px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.xl td.n{text-align:right}.xl td.k{color:var(--blue6)}
.xl td.g{background:var(--n50);color:var(--mute)}
.xl td.chg{background:var(--wbg);color:var(--warnTx);font-weight:700}
.xl tr.est td{background:#fff;font-weight:700;border-top:2px solid var(--rule)}
.keys{display:flex;gap:18px;font-size:13px;color:var(--sub);padding-top:8px;align-items:center}
.keys i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:6px;border:1px solid #D0D7DE}
/* 4 照合 */
.res{flex:1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;min-height:0}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.legend button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer}
.legend button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.legend span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.legend strong{display:block;font-size:36px;line-height:1.1}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;flex:none}
.s-ok{background:var(--blue)}.s-diff{background:var(--warn)}.s-spec{background:#fff;border:2px solid var(--warn)}.s-ind{background:var(--rule)}
.grp{margin-bottom:14px}.grp>span{font-size:13px;color:var(--sub);display:block;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:5px}
.tile{border:0;border-radius:4px;height:38px;font-size:11px;cursor:pointer;color:#fff;font-weight:500}
.tile.ok{background:var(--blue)}.tile.diff{background:var(--warn)}.tile.spec{background:#fff;border:2px solid var(--warn);color:var(--warnTx)}.tile.ind{background:var(--rule);color:var(--ink)}
.tile.dim{opacity:.18}.tile.cur{outline:3px solid var(--ink);outline-offset:2px}
.panel{border-left:1px solid var(--rule);padding-left:24px;display:flex;flex-direction:column;gap:12px;min-height:0}
.panel canvas{max-height:34vh;max-width:100%;align-self:flex-start;border:1px solid var(--n100);cursor:zoom-in}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;font-size:15px}
.cmp div{padding:8px 10px;border-bottom:1px solid var(--n100);text-align:right;font-variant-numeric:tabular-nums}
.cmp div:nth-child(3n+1){text-align:left;color:var(--sub);font-size:13px;padding-left:0}
.cmp .h{font-size:13px;color:var(--sub)}
.cmp .x{background:var(--wbg);color:var(--warnTx);font-weight:700}
.total{display:flex;gap:26px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--rule)}
.total span{display:block;font-size:13px;color:var(--sub)}.total b{font-size:24px}
@media(max-width:900px){.rv{grid-template-columns:minmax(0,1fr)}.list{max-height:38vh}.view{min-height:70vh}.read,.res{grid-template-columns:minmax(0,1fr)}.panel{border:0;padding:0}nav button span{display:none}.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.vbar{flex-wrap:wrap}.vbar b,.vbar .btn,.why{white-space:nowrap}.vbody{flex-direction:column}.drawer.open{width:100%;border-left:0;border-top:1px solid var(--rule)}.drawer>div{width:auto}.canvasbox{min-height:50vh}body{display:block}header{flex-wrap:wrap}header span{display:none}nav{margin-left:0;width:100%;justify-content:space-between}nav i{display:none}.res>div{overflow:visible!important}.xl{max-height:70vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><img src="assets/logo.svg" alt="AITech"><span id="pj"></span><nav id="nav"></nav></header>
<main id="main"></main>
<style>
/* 確認・修正 */
.row.done{background:#E8F2FC;border-left-color:#72A9DD}.row.done i{color:var(--blue6)}
.row.done.cur{background:#D3E6FA;border-left-color:var(--blue)}
.row .ck{font-style:normal;color:var(--blue);font-weight:700;margin-left:auto}
.list .cnt{align-items:center;white-space:nowrap}
nav button[aria-disabled=true]{opacity:.4;cursor:not-allowed}
.why.done{background:#E8F2FC;color:var(--blue6);border-color:#B8D5F2}
.ed{display:grid;grid-template-columns:26px 86px 1fr;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--n100)}
.ed>b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px}
.ed>span{font-size:13px;color:var(--sub)}
.ed .f{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.ed input,.ed select,.cf select,.cf input{font:inherit;font-size:15px;border:1px solid var(--rule);border-radius:4px;padding:4px 8px;min-height:36px;background:#fff;color:var(--ink)}
.ed input[type=number]{width:96px;text-align:right}
.ed input.w{width:150px}
.ed .ro{font-size:16px;font-weight:700}
.chg{border-color:#F0A54A!important;background:#FFF6EA!important}
.tag{font-size:11px;color:#8A4B00;background:#FFF1DE;border:1px solid #F0A54A;border-radius:10px;padding:0 7px}
.cf{margin-top:10px;display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
.cf select{width:100%}
.res2{margin-top:10px;border-radius:6px;background:var(--b50);padding:10px 14px}
.res2 .eq{font-size:16px;font-variant-numeric:tabular-nums}.res2 .eq em{font-style:normal;color:var(--blue);font-weight:700}
.res2 .r{font-size:26px;font-weight:700;color:var(--blue);margin-top:2px}.res2 .r small{font-size:14px;color:var(--sub);font-weight:400;margin:0 4px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;align-items:center}
.foot .note{margin-right:auto;font-size:12px;color:var(--sub)}
.btn.ok{background:#E8F2FC;border-color:#B8D5F2;color:var(--blue6)}

/* Excel */
.xl tr.fill td{animation:fillrow .5s ease-out both}
@keyframes fillrow{from{background:#D8EAFE}}
.xl tr.wait td{color:transparent}
.xl td.ed2{background:#FFF6EA;color:#8A4B00;font-weight:700}
.xprog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
.xprog .prog{width:220px}

<script>// 図面読み取りコア（ブラウザ・Node共通）。pdf.jsのドキュメントを受け取り、ルールだけで読み取る。
(function(root){
const R={};
// 文字：ページ左上原点のpt座標の箱にする
R.texts=async function(page){
  const vp=page.getViewport({scale:1}), tc=await page.getTextContent(), out=[];
  for(const it of tc.items){
    const s=(it.str||'').trim(); if(!s) continue;
    const [a,b,c,d,e,f]=it.transform, h=Math.hypot(c,d), L=Math.hypot(a,b)||1;
    const ux=a/L, uy=b/L, w=it.width;
    const pts=[[e,f],[e+ux*w,f+uy*w],[e-uy*h,f+ux*h],[e+ux*w-uy*h,f+uy*w+ux*h]].map(p=>vp.convertToViewportPoint(p[0],p[1]));
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const p0=pts[0], p1=pts[1], vert=Math.abs(p1[1]-p0[1])>Math.abs(p1[0]-p0[0]);
    out.push({s, x0:Math.min(...xs), y0:Math.min(...ys), x1:Math.max(...xs), y1:Math.max(...ys), vert});
  }
  return out;
};
// 線：stroke された折れ線（ページ左上原点のpt）
R.paths=async function(page, OPS){
  const vp=page.getViewport({scale:1}), ol=await page.getOperatorList(), out=[];
  let ctm=[1,0,0,1,0,0], stack=[], lw=1, cur=[];

,"111111111000000010000000100000001111111000000010000000010000000100000001100000011000001001111110|3":"5","001111000010000001000000100000001000000011111100100001101000001110000001100000011000001001111110|3":"6","001111000110000011000000100000001000000011111100100001101000001110000001100000011000001101111110|3":"6","011111101000001110000001000000010000001001111110110000001000000010000000100000001000000011111111|3":"2","011111101000001010000001100000011000001111000110011111101000001010000001100000011000001111111110|3":"8","111111101000001100000001000000110000001001111100110000001000000010000000100000001000000011111111|3":"2","011111001000011010000010000000100000011001111100110000001000000010000000100000001000000011111110|3":"2","111111111000000010000000111111000000011000000010000000010000000100000001000000011000001111111110|3":"5","111111001000011010000010100000101000011011111100110001001000001010000010100000101000011011111100|3":"8","011100001000100010000100100001001000010010000100100001001000010010000100100001001000110011111000|2":"0","111111111000000010000000100000001111110000000010000000010000000100000001100000011000001001111110|3":"5","111111111000000010000000100000001111111000000011000000010000000100000001100000011000001101111110|3":"5","011111101000001010000001000000010000001100000110011111001000000010000000100000001000000011111111|3":"2","111111101000001100000001000000010000001101111110110000001000000010000000100000001000000011111111|3":"2","111110001000110010000100100001001000010010000100100001001000010010000100100001001000100001110000|2":"0","111111101000001110000001100000011000001101111110110001101000001010000001100000011000001001111110|3":"8","111111001000001000000010000000100000001001111100110000001000000010000000100000001000000011111110|3":"2","011111101000001110000001100000011000000111000001011111110000000100000011000001100000110001111000|3":"9","011111101000001010000001000000010000001100000110000111100000001100000001100000011000001001111110|3":"3","000 pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';

const f2=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2});

const STEPS=['図面','読み取り・確認','Excel転記'];
const KEYS=['code','count','dim','spec','range'];
const COEFS=[['玄関プレスドア',3.0],['片開きフラッシュドア',2.9],['額入り片開きフラッシュドア',2.5],['片引きフラッシュドア（ガラリ付）',3.3],['親子開きフラッシュドア',2.7],['額入親子開きフラッシュドア',2.4],
  ['両開きフラッシュドア',2.6],['額入り両開きフラッシュドア',2.2],['両開きフラッシュドア（ガラリ付）',3.0],['ガラリ',4.2],['シャッター',3.7]];
const IND='個別計算（1か所の面積を入力）';

let doc=null, PAGES=[], D=[], thumbs=[], crops={}, step=-1, cur=0, xt='3', drawerOpen=true, written=false;
const nav=document.getElementById('nav'), main=document.getElementById('main');
const need=()=>D.filter(d=>d.st!=='ok'&&!d.ok).length;
function drawNav(){ const lock=need()>0;
  nav.innerHTML=D.length?STEPS.map((s,i)=>`${i?'<i></i>':''}<button role="tab" aria-selected="${i===step}" data-i="${i}" ${i===2&&lock?'aria-disabled="true" title="要確認をすべて確認すると進めます"':''}><b>${i+1}</b><span>${s}</span></button>`).join(''):'';
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(b.getAttribute('aria-disabled')==='true') return; go(+b.dataset.i); }); }
function go(i){ step=i; drawNav(); [s1,s2,s3][i](); }

/* ---------- 開始 ---------- */
function start(msg){
  main.innerHTML=`<div class="start"><label class="drop" id="dp"><svg width="56" height="64" viewBox="0 0 40 48" aria-hidden="true"><path d="M4 2h22l10 10v34H4z" fill="#fff" stroke="#0050A2" stroke-width="2"/><path d="M26 2v10h10" fill="none" stroke="#0050A2" stroke-width="2"/><text x="20" y="36" text-anchor="middle" font-size="10" font-weight="700" fill="#0050A2">PDF</text></svg>
  <span class="btn">設計図書PDFを選択</span><input type="file" accept="application/pdf" id="fi" hidden>${msg?`<span class="err">${esc(msg)}</span>`:''}</label></div>`;
  const fi=document.getElementById('fi'), dp=document.getElementById('dp');
  fi.onchange=()=>fi.files[0]&&run(fi.files[0]);
  dp.ondragover=e=>{e.preventDefault();dp.classList.add('over');}; dp.ondragleave=()=>dp.classList.remove('over');
  dp.ondrop=e=>{e.preventDefault();dp.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) run(f);};
}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function run(file){
  main.innerHTML=`<div class="start"><div class="load"><div class="n" id="ln">0<small>/ — ページ</small></div><div class="prog"><i id="lp"></i></div></div></div>`;
  const ln=document.getElementById('ln'), lp=document.getElementById('lp');
  try{
    doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const N=doc.numPages, items=[], sums={}; PAGES=[]; thumbs=[]; crops={};
    for(let n=1;n<=N;n++){
      const pg=await doc.getPage(n), T=await ZR.texts(pg), c=ZR.classify(T); c.no=n; PAGES.push(c);
      thumbs.push(await renderCanvas(pg,0.11));
      if(c.cat==='鉄部等塗装図'){ const P=await ZR.paths(pg,pdfjsLib.OPS); const its=ZR.fittings(T,P,TPL,{est:c.est,dwg:c.dwg,page:n});
        if(its.length){ const big=await renderCanvas(pg,3); for(const it of its) crops[it.est+'/'+it.code]=cropCanvas(big,it.cell,3); } items.push(...its); }
      if(c.cat==='住棟集計表') sums[c.est]=Object.assign(sums[c.est]||{},ZR.summary(T,c));
      ln.innerHTML=`${n}<small>/ ${N} ページ</small>`; lp.style.width=(n/N*100)+'%'; await tick();
    }
    build(items,sums);
    if(!D.length) throw new Error('鉄部等塗装図が見つかりません');
    window.__result=D.map(d=>({est:d.est,code:d.code,W:d.W,H:d.H,spec:d.spec,rng:d.rng,qty:d.qty,coef:d.coef??null,ind:!!d.ind,unit:d.unit,total:d.total,kubun:d.kubun}));
    go(0);
  }catch(e){ console.error(e); start('読み取れませんでした：'+e.message); }
}
async function renderCanvas(pg,scale){ const vp=pg.getViewport({scale}), c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; return c; }
function cropCanvas(big,b,s){ const p=3, c=document.createElement('canvas'); const x=(b.x0-p)*s, y=(b.y0-p)*s, w=(b.x1-b.x0+2*p)*s, h=(b.y1-b.y0+2*p)*s;
  c.width=Math.round(w); c.height=Math.round(h); c.getContext('2d').drawImage(big,x,y,w,h,0,0,c.width,c.height); return c; }
const NB={'朝霞膝折':3,'朝霞膝折第二':2,'鶴瀬市街地住宅':3,'大和新倉':1};
function build(items,sums){
  const ord=e=>EST.indexOf(e);
  D=items.map(it=>{ const j=ZR.judge(it), s=(sums[it.est]||{})[it.code]||{perb:[],total:0};
    const d={...it, ...j, qty:s.total, perb:(s.perb||[]).slice(0,NB[it.est]||9), sspec:s.spec||'', kubun:s.kubun||''};
    d.st=j.ind?'ind':(/片引き/.test(j.ctype||'')||j.shape==='3枚開き')?'guess':(d.sspec&&d.sspec!==d.spec)?'spec':'ok';
    d.ai={W:d.W,H:d.H,spec:d.spec,rng:d.rng,qty:d.qty,ctype:j.ind?IND:j.ctype,manual:null};
    d.v={...d.ai}; d.ok=false; calc(d); return d; })
   .sort((a,b)=>ord(a.est)-ord(b.est)||a.page-b.page||a.cell.y0-b.cell.y0||a.cell.x0-b.cell.x0);
}
// 確認画面の値（d.v）から面積を出す
function calc(d){ const v=d.v;
  if(v.ctype===IND){ d.unit=v.manual!=null&&v.manual!==''&&!isNaN(v.manual)?Math.round(+v.manual*100)/100:null; d.coefV=null; }
  else { const c=(COEFS.find(x=>x[0]===v.ctype)||[])[1]; d.coefV=c; d.unit=(v.W>0&&v.H>0&&c)?ZR.unit(+v.W,+v.H,c,v.rng==='片面'):null; }
  d.total=d.unit!=null&&v.qty!=null?Math.round(d.unit*(+v.qty)*100)/100:null;
}
const changed=(d,k)=>String(d.v[k]??'')!==String(d.ai[k]??'');
const anyChanged=d=>['W','H','spec','rng','qty','ctype','manual'].some(k=>changed(d,k));

/* ---------- 1 図面 ---------- */
function s1(){
  const a=PAGES.filter(p=>p.cat==='鉄部等塗装図').length, b=PAGES.filter(p=>p.cat==='住棟集計表').length;
  main.innerHTML=`<div class="tally"><div><strong>${PAGES.length}</strong>ページ</div><div class="a"><i></i>鉄部等塗装図 <strong>${a}</strong></div><div class="b"><i></i>住棟集計表 <strong>${b}</strong></div><span class="sp"></span><button class="btn" id="nx">読み取り・確認 →</button></div><div class="pdf" id="pd"></div>`;
  const pd=document.getElementById('pd');
  PAGES.forEach((p,i)=>{ const el=document.createElement('div'); el.className='pg'+(p.cat==='鉄部等塗装図'?' on':p.cat==='住棟集計表'?' on q':''); el.title=`p.${p.no} ${p.cat}`;
    const c=document.createElement('canvas'); c.width=thumbs[i].width; c.height=thumbs[i].height; c.getContext('2d').drawImage(thumbs[i],0,0); el.appendChild(c); el.onclick=()=>sheet(p.no,null); pd.appendChild(el); });
  document.getElementById('nx').onclick=()=>go(1);
}

/* ---------- 2 読み取り・確認 ---------- */
function rowHTML(d,i){ const lab=d.ok?'確認済み':d.st!=='ok'?WHY[d.st]:'';
  return `<button class="row ${d.ok?'done':d.st!=='ok'?'ng':''}" data-i="${i}"><b>${esc(d.code)}</b><span>${esc(d.name.replace(/（.*）/,'').replace(/^鋼製/,''))}</span>${lab?`<i>${d.ok?'✓ ':''}${lab}</i>`:''}</button>`; }
function s2(){
  main.innerHTML=`<div class="rv"><div class="list" id="ls"><div class="cnt" id="ct"></div>
  ${EST.map(e=>`<h4>${e}</h4>`+D.map((d,i)=>[d,i]).filter(([d])=>d.est===e).map(([d,i])=>rowHTML(d,i)).join('')).join('')}</div>
  <div class="view"><div class="vbar" id="vb"></div><div class="vbody"><div class="canvasbox"><div class="stage" id="st" title="クリックで図面全体"></div></div><div class="drawer ${drawerOpen?'open':''}" id="dr"></div></div></div></div>`;
  main.querySelectorAll('.row').forEach(b=>b.onclick=()=>show(+b.dataset.i));
  document.getElementById('st').onclick=()=>sheet(D[cur].page,D[cur]);
  counts(); show(cur);
}
function counts(){ const n=D.filter(d=>d.st!=='ok').length, rem=need(), ok=D.filter(d=>d.ok).length, el=document.getElementById('ct'); if(!el) return;
  el.innerHTML=`<span><b>${ok}</b>確認済</span><span class="o"><b>${rem}</b>要確認</span>${rem===0?`<button class="btn" id="gx" style="margin-left:auto;min-height:34px;padding:0 12px;white-space:nowrap">Excel転記 →</button>`:''}`;
  const gx=document.getElementById('gx'); if(gx) gx.onclick=()=>go(2); drawNav(); }
function refreshRow(i){ const old=document.querySelector(`.row[data-i="${i}"]`); if(!old) return; old.outerHTML=rowHTML(D[i],i); const nb=document.querySelector(`.row[data-i="${i}"]`); nb.onclick=()=>show(i); nb.classList.toggle('cur',i===cur); }
document.addEventListener('keydown',e=>{ if(document.querySelector('.modal')){ if(e.key==='Escape') document.querySelector('.modal').remove(); return; }
  if(step!==1||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if(e.key==='ArrowDown'){e.preventDefault();show(Math.min(cur+1,D.length-1));} if(e.key==='ArrowUp'){e.preventDefault();show(Math.max(cur-1,0));} });
function overlay(d,ox,oy,s,r){
  return KEYS.map((k,j)=>{ const bs=[].concat(d.boxes[k]||[]).filter(Boolean); return bs.map((b,m)=>{ const x=(b.x0-ox)*s,y=(b.y0-oy)*s,w=(b.x1-b.x0)*s,h=(b.y1-b.y0)*s;
    return `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>${(m===0||k==='dim')?`<g class="mk"><circle cx="${x+w+r*0.7}" cy="${y-r*0.5}" r="${r}"/><text x="${x+w+r*0.7}" y="${y-r*0.5}" style="font-size:${r*1.15}px">${j+1}</text></g>`:''}`; }).join(''); }).join('');
}
function toggleDrawer(){ drawerOpen=!drawerOpen; document.getElementById('dr').classList.toggle('open',drawerOpen); setTimeout(()=>show(cur,true),270); }
function show(i,keep){
  cur=i; const d=D[i], st=document.getElementById('st'); if(!st) return;
  bar(d);
  const c=crops[d.est+'/'+d.code], cw=c.width, ch=c.height, box=st.parentElement.getBoundingClientRect();
  const k=Math.min((box.width-28)/cw,(box.height-28)/ch);
  st.style.width=cw*k+'px'; st.style.height=ch*k+'px';
  st.innerHTML=''; const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; cv.getContext('2d').drawImage(c,0,0); st.appendChild(cv);
  const ox=d.cell.x0-3, oy=d.cell.y0-3, s=cw/(d.cell.x1-d.cell.x0+6);
  st.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none" aria-hidden="true">${overlay(d,ox,oy,s,Math.max(cw,ch)/34)}</svg>`);
  st.querySelectorAll('.box').forEach(b=>b.style.strokeWidth=Math.max(cw,ch)/300);
  if(!keep) panel(d);
  document.querySelectorAll('.row').forEach(b=>{ const on=+b.dataset.i===cur; b.classList.toggle('cur',on); if(on) b.scrollIntoView({block:'nearest'}); });
}
function bar(d){
  const w=d.ok?'確認済み':d.st==='ok'?'自動':WHY[d.st];
  document.getElementById('vb').innerHTML=`<b>${esc(d.est)}　${esc(d.code)}</b><span>${esc(d.dwg)}</span><span class="why ${d.ok?'done':d.st==='ok'?'ok':''}">${d.ok?'✓ ':''}${w}</span><span class="sp"></span><button class="btn sec" id="op">図面全体</button><button class="btn ${drawerOpen?'on':''}" id="rb" aria-expanded="${drawerOpen}">取得結果</button>`;
  document.getElementById('op').onclick=()=>sheet(d.page,d); document.getElementById('rb').onclick=toggleDrawer;
}
function panel(d){
  const v=d.v, ch=k=>changed(d,k)?'chg':'', isInd=v.ctype===IND;
  const specs=[...new Set([d.ai.spec,d.sspec,...D.map(x=>x.spec)].filter(Boolean))];
  document.getElementById('dr').innerHTML=`<div>
  <div class="ed"><b>1</b><span>記号</span><div class="f ro">${esc(d.code)}　${esc(d.name.replace(/（.*）/,''))}</div></div>
  <div class="ed"><b>2</b><span>設計数量</span><div class="f"><input type="number" min="0" step="1" data-k="qty" value="${esc(v.qty)}" class="${ch('qty')}" aria-label="設計数量"> か所</div></div>
  <div class="ed"><b>3</b><span>W × H</span><div class="f"><input type="number" min="0" step="1" data-k="W" value="${esc(v.W??'')}" class="${ch('W')}" aria-label="幅"> × <input type="number" min="0" step="1" data-k="H" value="${esc(v.H??'')}" class="${ch('H')}" aria-label="高さ"> mm</div></div>
  <div class="ed"><b>4</b><span>塗装仕様</span><div class="f"><select data-k="spec" class="${ch('spec')}" aria-label="塗装仕様">${specs.map(s=>`<option ${s===v.spec?'selected':''}>${esc(s)}</option>`).join('')}</select>${d.st==='spec'?`<span class="tag">集計表は ${esc(d.sspec)}</span>`:''}</div></div>
  <div class="ed"><b>5</b><span>塗装範囲</span><div class="f"><select data-k="rng" class="${ch('rng')}" aria-label="塗装範囲">${['両面','片面'].map(s=>`<option ${s===v.rng?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <div class="cf"><span>係数</span><select data-k="ctype" class="${ch('ctype')}" aria-label="係数">${COEFS.map(([n,c])=>`<option value="${esc(n)}" ${n===v.ctype?'selected':''}>${esc(n)}　×${c.toFixed(1)}</option>`).join('')}<option value="${IND}" ${isInd?'selected':''}>${IND}</option></select>
  ${isInd?`<span>1か所</span><div><input type="number" min="0" step="0.01" data-k="manual" value="${esc(v.manual??'')}" placeholder="例 4.09" style="width:120px;text-align:right" class="${ch('manual')}" aria-label="1か所の面積"> ㎡</div>`:''}</div>
  <div class="res2" id="rs"></div>
  <div class="foot"><span class="note" id="nt"></span>${d.ok?`<button class="btn sec" id="ud">確認を取り消す</button>`:''}<button class="btn ${d.ok?'ok':''}" id="okb">${d.ok?'✓ 確認済み':'確認'}</button></div></div>`;
  const dr=document.getElementById('dr');
  dr.querySelectorAll('[data-k]').forEach(el=>{ const h=()=>{ const k=el.dataset.k; let val=el.value; if(['W','H','qty'].includes(k)) val=val===''?null:+val; if(k==='manual') val=val===''?null:+val;
      d.v[k]=val; if(d.ok){ d.ok=false; refreshRow(cur); counts(); bar(d); }
      if(k==='ctype') { panel(d); return; } el.classList.toggle('chg',changed(d,k)); result(d); };
    el.addEventListener(el.tagName==='SELECT'?'change':'input',h); });
  document.getElementById('okb').onclick=()=>confirm(d);
  const ud=document.getElementById('ud'); if(ud) ud.onclick=()=>{ d.ok=false; refreshRow(cur); counts(); bar(d); panel(d); };
  result(d);
}
function result(d){ calc(d); const v=d.v, rs=document.getElementById('rs'), isInd=v.ctype===IND;
  rs.innerHTML=isInd?`<div class="eq">個別計算</div><div class="r">${f2(d.unit)}<small>㎡ ×</small>${esc(v.qty)}<small>＝</small>${f2(d.total)}<small>㎡</small></div>`
   :`<div class="eq">${v.W?(v.W/1000).toFixed(2):'—'} × ${v.H?(v.H/1000).toFixed(2):'—'} × <em>${d.coefV?d.coefV.toFixed(1):'—'}</em>${v.rng==='片面'?' × 0.5':''}</div><div class="r">${f2(d.unit)}<small>㎡ ×</small>${esc(v.qty)}<small>＝</small>${f2(d.total)}<small>㎡</small></div>`;
  const okb=document.getElementById('okb'); okb.disabled=d.unit==null;
  document.getElementById('nt').textContent=d.unit==null?(isInd?'1か所の面積を入れると確認できます':'寸法を入れてください'):anyChanged(d)?'修正あり':'';
}
function confirm(d){ if(d.unit==null) return; d.ok=true; refreshRow(cur); counts();
  const nx=D.findIndex((x,i)=>i>cur&&x.st!=='ok'&&!x.ok), first=D.findIndex(x=>x.st!=='ok'&&!x.ok);
  const j=nx>=0?nx:first; if(j>=0&&d.st!=='ok') show(j); else { bar(d); panel(d); } }
async function sheet(no,d){
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="sheet"><div class="h"><b>p.${no}</b><span>${esc((PAGES[no-1]||{}).cat||'')}　${esc((PAGES[no-1]||{}).dwg||'')}</span><button class="btn sec" id="cl">閉じる</button></div><div class="b" id="sb"></div></div>`;
  document.body.appendChild(m); m.onclick=e=>{ if(e.target===m) m.remove(); }; m.querySelector('#cl').onclick=()=>m.remove();
  const pg=await doc.getPage(no), vp0=pg.getViewport({scale:1}), s=Math.min((window.innerWidth-60)/vp0.width,(window.innerHeight-110)/vp0.height);
  const c=await renderCanvas(pg,s*(window.devicePixelRatio||1)); c.style.width=vp0.width*s+'px'; c.style.height=vp0.height*s+'px';
  const sb=m.querySelector('#sb'); sb.appendChild(c);
  if(d){ const b=d.cell; sb.insertAdjacentHTML('beforeend',`<svg width="${vp0.width*s}" height="${vp0.height*s}"><rect x="${b.x0*s}" y="${b.y0*s}" width="${(b.x1-b.x0)*s}" height="${(b.y1-b.y0)*s}" fill="rgba(0,80,162,.06)" stroke="#0050A2" stroke-width="3"/>${overlay(d,0,0,s,9)}</svg>`); }
}
window.addEventListener('resize',()=>{ if(step===1&&D.length) show(cur,true); });

/* ---------- 3 Excel転記 ---------- */
const nm=d=>d.name.replace(/（.*）/,'');
const key=d=>EK[d.est]+'/'+d.code;
function s3(){
  main.innerHTML=`<div class="xlbar"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="16" height="16" rx="2" fill="#007D6D"/><path d="M5 5l8 8M13 5l-8 8" stroke="#fff" stroke-width="2"/></svg><b style="font-weight:500">数量調書.xlsx</b>
  <div class="tabs">${[['3','③ 計算書'],['4','④ 住棟集計表']].map(([k,l])=>`<button data-x="${k}" aria-pressed="${k===xt}">${l}</button>`).join('')}</div></div>
  <div class="xl" id="xl"></div>
  <div class="keys"><span><i style="background:#FFF6EA"></i>確認で修正した値</span><span class="sp"></span><span class="xprog" id="xp"></span><button class="btn" id="go">${written?'もう一度転記する':'転記する'}</button>${written?'<button class="btn sec" id="dl">Excelを保存</button>':''}</div>`;
  main.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{xt=b.dataset.x; s3();});
  document.getElementById('go').onclick=transcribe;
  const dl=document.getElementById('dl'); if(dl) dl.onclick=download;
  table(written);
}
function table(filled){
  const xl=document.getElementById('xl'); let h='';
  const cell=(d,k,txt,cls='')=>`<td class="${cls} ${changed(d,k)?'ed2':''}">${txt}</td>`;
  if(xt==='3'){
    h=`<table><thead><tr><th>記号</th><th>区分</th><th>名称</th><th>塗装仕様</th><th>塗装範囲</th><th>W</th><th>H</th><th>n(係数)</th><th>N1</th><th>片面</th><th>単位面積(m2)</th></tr></thead><tbody>${EST.map(e=>`<tr class="est"><td colspan="11">${e}</td></tr>`+D.filter(d=>d.est===e).map(d=>{ const g=d.v.ctype===IND;
      return `<tr class="${filled?'':'wait'}" data-r><td class="k">${esc(key(d))}</td><td>${esc(d.kubun)}</td><td>${esc(nm(d))}</td>${cell(d,'spec',esc(d.v.spec))}${cell(d,'rng',esc(d.v.rng))}
      ${cell(d,'W',g?'':d.v.W/1000,'n')}${cell(d,'H',g?'':d.v.H/1000,'n')}${cell(d,'ctype',g?'個別':d.coefV,'n')}<td class="n">${g?'':1}</td><td class="n">${!g&&d.v.rng==='片面'?0.5:''}</td>${cell(d,g?'manual':'ctype',f2(d.unit),'n')}</tr>`;}).join('')).join('')}</tbody></table>`;
  } else {
    h=`<table><thead><tr><th>記号</th><th>名称</th><th>単位面積</th><th>棟ごとの数量</th><th>計 数量</th><th>計 面積 m2</th></tr></thead><tbody>${EST.map(e=>`<tr class="est"><td colspan="6">${e}</td></tr>`+D.filter(d=>d.est===e).map(d=>
      `<tr class="${filled?'':'wait'}" data-r><td class="k">${esc(key(d))}</td><td>${esc(nm(d))}</td><td class="n">${f2(d.unit)}</td><td>${(d.perb||[]).map((q,i)=>q?`${BL[e][i]||''} ${q}`:'').filter(Boolean).join('　')}</td>${cell(d,'qty',d.v.qty,'n')}<td class="n">${f2(d.total)}</td></tr>`).join('')).join('')}</tbody></table>`;
  }
  xl.innerHTML=h;
}
async function transcribe(){
  const go=document.getElementById('go'); go.disabled=true; xt='3'; main.querySelectorAll('[data-x]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.x==='3')); table(false);
  const rows=[...document.querySelectorAll('#xl tr[data-r]')], xp=document.getElementById('xp'), xl=document.getElementById('xl');
  xp.innerHTML=`<span id="xn">0 / ${rows.length}</span><div class="prog"><i id="xb"></i></div>`;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(let i=0;i<rows.length;i++){ rows[i].classList.remove('wait'); rows[i].classList.add('fill');
    if(!reduce){ const r=rows[i].offsetTop-xl.clientHeight+60; if(r>xl.scrollTop) xl.scrollTop=r; }
    document.getElementById('xn').textContent=`${i+1} / ${rows.length}`; document.getElementById('xb').style.width=((i+1)/rows.length*100)+'%';
    if(!reduce) await new Promise(r=>setTimeout(r,70)); }
  written=true; await download(); s3();
}
// Excel：③計算書・④住棟集計表・読み取り記録（数式つき）
async function download(){
  const wb=new ExcelJS.Workbook(); wb.creator='AITech 図面積算AI';
  const font={name:'Meiryo UI',size:10}, head={type:'pattern',pattern:'solid',fgColor:{argb:'FFEEF2F5'}}, edc={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF6EA'}};
  const border={top:{style:'thin',color:{argb:'FFC7CFD7'}},left:{style:'thin',color:{argb:'FFC7CFD7'}},bottom:{style:'thin',color:{argb:'FFC7CFD7'}},right:{style:'thin',color:{argb:'FFC7CFD7'}}};
  const ws=wb.addWorksheet('③専用部・共用部',{views:[{state:'frozen',ySplit:4}]});
  ws.getCell('A1').value='鉄部等塗装工事　計算書　【建具】'; ws.getCell('A1').font={...font,size:14,bold:true};
  ws.getCell('A2').value='寸法・塗装仕様・塗装範囲は鉄部等塗装図、係数は塗装係数表より。橙色は確認で修正した値。'; ws.getCell('A2').font={...font,color:{argb:'FF4E565F'}};
  const H3=['記号','区分','名称','塗装仕様','塗装範囲','部位','W','','H','','n(係数)','','N1','','片面','','小計','単位面積(m2)'];
  ws.getRow(4).values=H3; ws.getRow(4).eachCell(c=>{c.fill=head;c.font={...font,bold:true};c.border=border;c.alignment={horizontal:'center'};});
  [12,8,22,14,9,8,8,3,8,3,9,3,6,3,6,3,10,13].forEach((w,i)=>ws.getColumn(i+1).width=w);
  let r=5; const ref={};
  for(const e of EST){ const L=D.filter(d=>d.est===e); if(!L.length) continue;
    ws.getCell(`A${r}`).value=e; ws.getCell(`A${r}`).font={...font,bold:true}; r++;
    for(const d of L){ const g=d.v.ctype===IND, row=ws.getRow(r);
      row.values=[key(d),d.kubun,nm(d),d.v.spec,d.v.rng,g?'個別計算':'',g?null:d.v.W/1000,g?'':'×',g?null:d.v.H/1000,g?'':'×',g?null:d.coefV,g?'':'×',g?null:1,g?'':'×',g?null:(d.v.rng==='片面'?0.5:null),g?'':'='];
      if(g){ row.getCell(17).value=d.unit; } else row.getCell(17).value={formula:`ROUND(PRODUCT(G${r},I${r},K${r},M${r},O${r}),2)`,result:d.unit};
      row.getCell(18).value={formula:`Q${r}`,result:d.unit};
      row.eachCell({includeEmpty:true},(c,i)=>{ if(i<=18){ c.font=font; c.border=border; } if([7,9,11,13,15,17,18].includes(i)) c.numFmt='0.00##'; });
      const mark=(k,col)=>{ if(changed(d,k)) row.getCell(col).fill=edc; };
      mark('spec',4); mark('rng',5); mark('W',7); mark('H',9); mark('ctype',11); if(g) mark('manual',17);
      ref[key(d)]=r; r++; } }
  const w4=wb.addWorksheet('④住棟集計表',{views:[{state:'frozen',ySplit:4}]});
  w4.getCell('A1').value='鉄部等塗装工事　住棟集計表　【建具】'; w4.getCell('A1').font={...font,size:14,bold:true};
  const bmax=3, H4=['記号','名称','塗装仕様','単位','単位面積'];
  for(let b=0;b<bmax;b++) H4.push(`棟${b+1} 数量`,`棟${b+1} 面積`); H4.push('計 数量','計 面積(m2)');
  w4.getRow(4).values=H4; w4.getRow(4).eachCell(c=>{c.fill=head;c.font={...font,bold:true};c.border=border;c.alignment={horizontal:'center',wrapText:true};});
  [12,22,14,6,10,8,10,8,10,8,10,9,12].forEach((w,i)=>w4.getColumn(i+1).width=w);
  r=5; const C=n=>String.fromCharCode(64+n);
  for(const e of EST){ const L=D.filter(d=>d.est===e); if(!L.length) continue;
    w4.getCell(`A${r}`).value=`${e}（${BL[e].join('・')}）`; w4.getCell(`A${r}`).font={...font,bold:true}; r++;
    for(const d of L){ const row=w4.getRow(r), rr=ref[key(d)];
      row.getCell(1).value=key(d); row.getCell(2).value=nm(d); row.getCell(3).value=d.v.spec; row.getCell(4).value='m2';
      row.getCell(5).value={formula:`'③専用部・共用部'!R${rr}`,result:d.unit};
      const q=d.perb&&d.perb.length&&d.perb.reduce((a,b)=>a+b,0)===+d.v.qty?d.perb:[+d.v.qty];
      for(let b=0;b<bmax;b++){ const qc=6+b*2; row.getCell(qc).value=q[b]??null; row.getCell(qc+1).value={formula:`IF(${C(qc)}${r}="","",ROUND($E${r}*${C(qc)}${r},2))`,result:q[b]!=null&&d.unit!=null?Math.round(d.unit*q[b]*100)/100:''}; }
      row.getCell(12).value={formula:`SUM(F${r},H${r},J${r})`,result:+d.v.qty}; row.getCell(13).value={formula:`ROUND(E${r}*L${r},2)`,result:d.total};
      for(let i=1;i<=13;i++){ const c=row.getCell(i); c.font=font; c.border=border; if(i>=5) c.numFmt=[5,7,9,11,13].includes(i)?'#,##0.00':'#,##0'; }
      if(changed(d,'qty')) row.getCell(12).fill=edc; r++; } }
  const w5=wb.addWorksheet('読み取り記録');
  w5.getRow(1).values=['団地','記号','図面','ページ','状態','確認','修正した項目','W(AI)','H(AI)','仕様(AI)','範囲(AI)','数量(AI)','係数区分(AI)'];
  w5.getRow(1).eachCell(c=>{c.fill=head;c.font={...font,bold:true};c.border=border;});
  D.forEach((d,i)=>{ w5.getRow(i+2).values=[d.est,d.code,d.dwg,d.page,d.st==='ok'?'自動':WHY[d.st],d.ok?'確認済み':'',['W','H','spec','rng','qty','ctype','manual'].filter(k=>changed(d,k)).map(k=>({W:'W',H:'H',spec:'塗装仕様',rng:'塗装範囲',qty:'数量',ctype:'係数',manual:'個別面積'})[k]).join('・'),d.ai.W,d.ai.H,d.ai.spec,d.ai.rng,d.ai.qty,d.ai.ctype];
    w5.getRow(i+2).eachCell(c=>{c.font=font;c.border=border;}); });
  [14,8,6,6,12,8,18,7,7,12,7,7,28].forEach((w,i)=>w5.getColumn(i+1).width=w);
  const buf=await wb.xlsx.writeBuffer(), blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const t=new Date(), stamp=`${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  window.__xlsx=buf;
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`数量調書_転記_${stamp}.xlsx`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }catch(e){ console.error(e); }
}
start();
}
